version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - AGENT_MODE=online
      - DATABASE_URL=sqlite+aiosqlite:///./operia.db
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    volumes:
      - ./backend/operia.db:/app/operia.db
    networks:
      - default
      - dev-infra-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - default

networks:
  default:
  dev-infra-network:
    external: true
